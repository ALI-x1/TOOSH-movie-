plugins {
    id 'com.android.application'
}

android {
    // Java sources keep their original package; applicationId is the app's real identity.
    namespace 'com.kralmovie.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.toosh.movie'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.1'
    }

    // One fixed key, so every new build installs OVER the old one (keeps likes/history).
    signingConfigs {
        toosh {
            storeFile file('toosh.keystore')
            storePassword 'toosh123'
            keyAlias 'toosh'
            keyPassword 'toosh123'
        }
    }

    // arm64-v8a only (every phone since ~2017). Smaller APK, single file to download.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        debug {
            debuggable false
            signingConfig signingConfigs.toosh
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.toosh
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
}
