plugins {
    id 'com.android.application'
}

android {
    // Java sources keep their original package; applicationId is the app's real identity.
    namespace 'com.kralmovie.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.toosh.movie'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug key keeps the APK installable without managing a keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
}
