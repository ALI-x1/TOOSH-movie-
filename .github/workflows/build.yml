//
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First run only: unpack project.zip into real files in the repo, then delete the zip
      - name: Unpack project.zip (once)
        run: |
          if [ -f project.zip ]; then
            unzip -qo project.zip
            rm project.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unpack project files"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TOOSH-MOVIE-apk
          path: app/build/outputs/apk/release/*.apk
